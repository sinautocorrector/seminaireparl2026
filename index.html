<header class="topbar">

</header>

<section class="hero">
  <div class="ring ring1"></div><div class="ring ring2"></div><div class="ring ring3"></div>
  <div class="hero-inner wrap">
    <div class="hero-logos"><img src="logos.png" alt="Socios del proyecto PaRL: iker, FoReLLIS, CLLE, MSH Bordeaux, Región Nueva Aquitania, Universidad Bordeaux Montaigne"></div>
    <div class="hero-main">
      <div class="eyebrow">Seminario</div>
      <h1>¿Qué lengua enseñar?</h1>
      <p class="sub">Perspectivas sobre la variación en la enseñanza de lenguas</p>
      <div class="hero-facts">
        <div class="fact-date">4 de noviembre de 2026</div>
        <div class="fact-line">09:00 - 13:15 h - Sala Jean Borde, MSHBx</div>
        <div class="fact-line">Universidad Bordeaux Montaigne - formato híbrido (presencial y Zoom)</div>
        <div class="fact-line"><a href="https://u-bordeaux-montaigne-fr.zoom.us/j/85055485570" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">Enlace Zoom ↗</a></div>
      </div>
      <div class="hero-organizers">Organización: <b>Nicolas Guilliot</b> y <b>Paula Alexandra Montenegro</b></div>
      <div class="hero-mark"><span class="parl">PaRL</span><span class="tagline">Patrimoine Régional Linguistique</span></div>
    </div>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 300" preserveAspectRatio="none">
    <path d="M0,160 C260,90 560,210 900,130 C1150,70 1300,150 1440,110 L1440,300 L0,300 Z" fill="var(--blue-pale)" opacity="0.55"/>
    <path d="M0,210 C300,150 620,260 960,180 C1180,130 1300,200 1440,170 L1440,300 L0,300 Z" fill="var(--blue)" opacity="0.45"/>
    <path d="M0,255 C280,215 600,290 960,235 C1180,200 1300,250 1440,225 L1440,300 L0,300 Z" fill="var(--navy)"/>

</section>

<section id="programa">
  <div class="wrap">
    <div class="section-head">
      <div class="rule"></div>
      <div class="eyebrow">Programa</div>
      <h2>Programa de la jornada</h2>
      <p>Cuatro intervenciones agrupadas por región geográfica de contacto - español y catalán, por un lado; francés y lenguas regionales de Nueva Aquitania, por otro - seguidas de una discusión general. Cada intervención indica si la lengua tratada es mayorizada o minorizada.</p>
    </div>
    <div class="timeline">

      <div class="t-item break"><div class="t-dot"></div><div class="t-time">09:00 - 09:30</div><div class="t-label">Recepción de las personas participantes</div></div>
      <div class="t-item break"><div class="t-dot"></div><div class="t-time">09:30 - 09:45</div><div class="t-label">Apertura del seminario</div></div>

      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-time accent">09:45 - 10:15</div>
        <div class="talk-card major">
          <div class="talk-speaker">María Antonieta Andión Herrero</div>
          <div class="talk-inst">UNED, España - intervención a distancia</div>
          <div class="langtag major">Español, lengua mayorizada</div>
          <div class="talk-title">La relación entre variedad y estándar en la enseñanza del español como lengua extranjera: (re)conocimiento, inserción curricular y actitudes</div>
          <details class="more"><summary>Ver resumen</summary><div class="body">El consenso alcanzado actualmente entre los hispanohablantes en torno al reconocimiento del español como lengua plurilectal, dotada de varios centros normativos, favorece un enfoque ecolingüístico del modelo de enseñanza de la lengua a hablantes nativos y no nativos, enfoque con el que autoridades, docentes, estudiantes, investigadores e investigadoras, editoriales y empresas deberían sentirse comprometidos. Esto supone adoptar un modelo de lengua flexible, que supere las posturas lectocéntricas y parta de consideraciones adaptadas a las distintas condiciones, geografías, circunstancias y expectativas de quienes enseñan y aprenden español, dentro y fuera de las comunidades hispanohablantes.</div></details>
          <details class="more"><summary>Ver biografía</summary><div class="body">María Antonieta Andión Herrero es licenciada en Filología Hispánica por la Universidad de La Habana (Cuba) y doctora en Filología Hispánica por la Universidad de Alcalá (España). Trabajó como investigadora de la Academia de Ciencias de Cuba y desde 1999 es profesora titular del departamento de Lengua española y Lingüística general de la Universidad Nacional de Educación a Distancia (UNED, España). Ha desempeñado varios cargos institucionales y de dirección y coordinación de cursos de formación, expertos y másteres en la UNED y en el extranjero. Es autora de materiales didácticos de enseñanza del español como lengua materna y lengua extranjera, y de artículos y libros en el área de la Lingüística aplicada a la enseñanza de lenguas y de la Dialectología. Ha participado en proyectos de la Academia de Ciencias de Cuba, la Real Academia de la Lengua Española, el Instituto Cervantes y el Ministerio de Educación, Formación profesional y Deportes (España), y ha sido investigadora principal de proyectos de excelencia del Ministerio de Educación de España. Ha sido y es asesora científica del Instituto Cervantes.</div></details>
        </div>
      </div>

      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-time dark">10:15 - 10:45</div>
        <div class="talk-card minor">
          <div class="talk-speaker">Ivan Solivellas</div>
          <div class="talk-inst">Universitat de les Illes Balears</div>
          <div class="langtag minor">Catalán, lengua minorizada</div>
          <div class="talk-title">Estandarizar para existir: una mirada glotopolítica sobre el concepto de estándar</div>
          <details class="more"><summary>Ver resumen</summary><div class="body">La estandarización es un proceso de planificación lingüística que da lugar a un modelo de lengua supradialectal que facilita la eficacia comunicativa entre variedades y que, al mismo tiempo, define la lengua misma (Bibiloni, 2007). El estándar depende, por tanto, más de la política que de la lengua. Además, el establecimiento de este modelo de lengua está intrínsecamente ligado a la aparición de la cultura del estándar (Milroy, 2001) y a las ideologías que suscita, entre ellas la distinción entre correcto e incorrecto, o entre estándar y dialectal, que responde siempre a dinámicas basadas en el prestigio de ciertas formas en detrimento de otras, prestigio que depende de cuestiones extralingüísticas. Por ello, algunos autores han criticado la noción de lengua estándar y han cuestionado su utilidad (Gal, 2006; Duchêne &amp; Heller, 2012), como recuerda Pradilla (2024). Ahora bien, al cuestionar la noción de estándar y, por extensión, la estandarización, conviene preguntarse qué implica esto. Al fin y al cabo, defender el estándar no tiene el mismo sentido en el marco de lenguas hegemónicas, como el español o el francés, que en el de lenguas minorizadas, como ocurre con el catalán, el occitano o el euskera.<br><br>En efecto, la estandarización constituye un elemento clave de los procesos de normalización o revitalización lingüística (Pradilla, 2024). En esta contribución me propongo, por tanto, reflexionar sobre la noción de estándar y sus implicaciones ideológicas desde una perspectiva glotopolítica, teniendo en cuenta los distintos factores que afectan a ecosistemas comunicativos diversos.</div></details>
          <details class="more"><summary>Ver biografía</summary><div class="body">Ivan Solivellas es doctor en Traducción y Ciencias del Lenguaje por la Universitat Pompeu Fabra (2021) y profesor titular laboral de la Universitat de les Illes Balears, donde imparte asignaturas relacionadas con la planificación lingüística y la gestión del multilingüismo en la enseñanza. Anteriormente, también impartió clase en la Universitat de Barcelona y en la Universitat Pompeu Fabra. Su investigación se centra en la glotopolítica y en los estudios críticos del discurso, con un interés especial por las ideologías lingüísticas, las representaciones de la diversidad lingüística y la intersección entre discurso, política y sociedad.</div></details>
        </div>
      </div>

      <div class="t-item break"><div class="t-dot"></div><div class="t-time">10:45 - 11:15</div><div class="t-label"><span class="ico">&#9749;</span>Pausa café</div></div>

      <div class="t-item">

        <div class="talk-card major">

          <div class="langtag major">Francés, lengua mayorizada</div>
          <div class="talk-title">Un francés, muchos franceses de África: la variación diatópica como riqueza y no como desviación</div>
          <details class="more"><summary>Ver resumen</summary><div class="body">La variación diatópica del francés en África designa el conjunto de diferenciaciones lingüísticas vinculadas al espacio geográfico, que hacen que el francés hablado y escrito en el continente africano ya no constituya una realidad uniforme, sino una pluralidad de variedades regionales, cada una moldeada por su entorno sociolingüístico, histórico y cultural. Nacida del contacto prolongado entre el francés, las lenguas importadas y las lenguas africanas (ewondo, eton, bulu, wólof, bambara, lingala, suajili, árabe, etc.), de la «herencia» colonial, de la urbanización y de la movilidad de las poblaciones, esta variación se manifiesta en todos los niveles de la lengua (fonético, léxico, sintáctico, semántico y pragmático). Produce usos específicos como <i>essencerie</i> en Senegal, <i>boucantier</i> en Costa de Marfil o <i>ambiancer</i> en Camerún, al tiempo que dibuja grandes áreas regionales (África Occidental, África Central, Magreb, Océano Índico) con particularismos bien identificables. Lejos de representar una simple desviación respecto a una norma metropolitana, esta variación diatópica constituye hoy un fenómeno lingüístico de pleno derecho, revelador de la vitalidad del francés en el continente y de su capacidad para arraigarse en contextos socioculturales diversos; invita, por tanto, a la investigación en lenguas y a la Francofonía a reconocer la existencia de normas endógenas legítimas, a repensar la pedagogía del francés adaptándola a las realidades locales, y a considerar el francés africano como un espacio de pluralidad normada o compartida donde se negocian identidades, poderes y creatividad lingüística.</div></details>
          <details class="more"><summary>Ver biografía</summary><div class="body">Sylvain Medzogo es doctor en Ciencias del Lenguaje y Didáctica (Universidad de Ginebra), especialista en francofonías plurales y en fonías en contextos multilingües. Antiguo alumno de la École Normale, formador de formadores en letras bilingües (francés e inglés) en Camerún y profesor de escuelas de madurez en Suiza (francés e inglés), es miembro de varias sociedades científicas, además de alumni y colaborador externo de la Universidad de Ginebra.</div></details>

      <h2>Programme de la journée</h2>
      <p>Quatre interventions regroupées par région géographique de contact - espagnol et catalan, d’une part ; français et langues régionales de Nouvelle-Aquitaine, d’autre part - suivies d’une discussion générale. Chaque intervention précise si la langue traitée est majorisée ou minorisée.</p>
    </div>
    <div class="timeline">

      <div class="t-item break"><div class="t-dot"></div><div class="t-time">09h00 - 09h30</div><div class="t-label">Accueil des participant·e·s</div></div>
      <div class="t-item break"><div class="t-dot"></div><div class="t-time">09h30 - 09h45</div><div class="t-label">Ouverture du séminaire</div></div>

      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-time accent">09h45 - 10h15</div>
        <div class="talk-card major">
          <div class="talk-speaker">María Antonieta Andión Herrero</div>
          <div class="talk-inst">UNED, Espagne - intervention à distance</div>
          <div class="langtag major">Espagnol, langue majorisée</div>
          <div class="talk-title">Le rapport entre variété et standard dans l’enseignement de l’espagnol langue étrangère : (re)connaissance, insertion curriculaire et attitudes</div>
          <details class="more"><summary>Voir le résumé</summary><div class="body">Le consensus actuellement atteint parmi les hispanophones quant à la reconnaissance de l’espagnol comme langue plurilectale, dotée de plusieurs centres normatifs, favorise une approche écolinguistique du modèle d’enseignement de la langue aux locuteurs natifs et non natifs, approche à laquelle autorités, enseignant·e·s, étudiant·e·s, chercheur·euse·s, maisons d’édition et entreprises devraient se sentir engagés. Cela suppose d’adopter un modèle de langue flexible, qui dépasse les positions lectocentriques et parte de considérations adaptées aux différentes conditions, géographies, circonstances et attentes de celles et ceux qui enseignent et apprennent l’espagnol, au sein comme en dehors des communautés hispanophones.</div></details>
          <details class="more"><summary>Voir la biographie</summary><div class="body">María Antonieta Andión Herrero a fait des études en Philologie hispanique à l’Université de La Havane (Cuba) et est docteure en Philologie hispanique de l’Université d’Alcalá (Espagne). Depuis 1999, elle est professeure titulaire au département de Langue espagnole et Linguistique générale de l’UNED. Elle est autrice de matériels pédagogiques ainsi que d’articles et d’ouvrages en linguistique appliquée à l’enseignement des langues et en dialectologie. Elle a été chercheuse principale de projets d’excellence du ministère de l’Éducation d’Espagne et est conseillère scientifique de l’Institut Cervantes.</div></details>
        </div>
      </div>

      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-time dark">10h15 - 10h45</div>
        <div class="talk-card minor">
          <div class="talk-speaker">Ivan Solivellas</div>
          <div class="talk-inst">Universitat de les Illes Balears</div>
          <div class="langtag minor">Catalan, langue minorisée</div>
          <div class="talk-title">Standardiser pour exister : un regard glotopolitique sur le concept de standard</div>
          <details class="more"><summary>Voir le résumé</summary><div class="body">La standardisation est un processus de planification linguistique qui donne lieu à un modèle de langue supradialectal facilitant l’efficacité communicative entre variétés et qui, du même coup, définit la langue elle-même (Bibiloni, 2007). Le standard relève donc davantage de la politique que de la langue. En outre, l’établissement de ce modèle de langue est intrinsèquement lié à l’émergence de la culture du standard (Milroy, 2001) et aux idéologies qu’elle suscite, parmi lesquelles la distinction entre correct et incorrect, ou entre standard et dialectal, qui répond toujours à des dynamiques fondées sur le prestige de certaines formes au détriment d’autres, lesquelles relèvent de questions extralinguistiques. C’est pourquoi certains auteurs ont critiqué la notion de langue standard et ont remis en question son utilité (Gal, 2006 ; Duchêne &amp; Heller, 2012), comme le rappelle Pradilla (2024). Or, lorsque l’on remet en question la notion de standard et, par extension, la standardisation, il convient de s’interroger sur ce que cela implique. Après tout, défendre le standard n’a pas le même sens dans le cadre de langues hégémoniques, comme l’espagnol ou le français, que dans celui de langues minorisées, comme c’est le cas du catalan, de l’occitan ou du basque.<br><br>De fait, la standardisation constitue un élément clé des processus de normalisation ou de revitalisation linguistiques (Pradilla, 2024). Dans cette contribution, je me propose donc de réfléchir à la notion de standard et à ses implications idéologiques dans une perspective glottopolitique, en tenant compte des différents facteurs qui affectent des écosystèmes communicatifs divers.</div></details>
          <details class="more"><summary>Voir la biographie</summary><div class="body">Ivan Solivellas est docteur en Traduction et Sciences du langage de l’Università Pompeu Fabra (2021) et maître de conférences à l’Universitat de les Illes Balears, où il enseigne des matières liées à la planification linguistique et à la gestion du multilinguisme dans l’enseignement. Ses recherches portent sur la glottopolitique et les études critiques du discours.</div></details>
        </div>
      </div>

          <div class="langtag major">Français, langue majorisée</div>
          <div class="talk-title">Un français, des français d’Afrique : la variation diatopique comme richesse et non comme écart</div>
          <details class="more"><summary>Voir le résumé</summary><div class="body">La variation diatopique du français en Afrique désigne l’ensemble des différenciations linguistiques liées à l’espace géographique, qui font que le français parlé et écrit sur le continent africain ne constitue plus une réalité uniforme mais bien une pluralité de variétés régionales, chacune façonnée par son environnement sociolinguistique, historique et culturel. Née du contact prolongé entre le français, les langues importées et les langues africaines (Ewondo, Eton, Bulu, Wolof, Bambara, Lingala, Swahili, Arabe, etc.), de l’« héritage » colonial, de l’urbanisation et de la mobilité des populations, cette variation se manifeste à tous les niveaux de la langue (phonétique, lexical, syntaxique, sémantique et pragmatique). Elle produit des usages spécifiques tels que <i>essencerie</i> au Sénégal, <i>boucantier</i> en Côte d’Ivoire ou <i>ambiancer</i> au Cameroun, tout en dessinant de grandes aires régionales (Afrique de l’Ouest, Afrique centrale, Maghreb, Océan Indien) aux particularismes bien identifiables. Loin de représenter un simple écart par rapport à une norme métropolitaine, cette variation diatopique constitue aujourd’hui un phénomène linguistique à part entière, révélateur de la vitalité du français sur le continent et de sa capacité à s’enraciner dans des contextes socioculturels divers ; elle invite dès lors la recherche en langues et la Francophonie à reconnaître l’existence de normes endogènes légitimes, à repenser la pédagogie du français en l’adaptant aux réalités locales, et à considérer le français africain comme un espace de pluralité normée ou partagée où se négocient identités, pouvoirs et créativité langagière.</div></details>
          <details class="more"><summary>Voir la biographie</summary><div class="body">Sylvain II Medzogo est docteur en sciences du langage et didactique (doctorat obtenu à l’Université de Genève), spécialiste des francophonies plurielles et autres phonies en contextes multilingues ; normalien, formateur des formateurs en lettres bilingues (français et anglais) au Cameroun, professeur des écoles de maturité en Suisse (français et anglais) ; membre de plusieurs sociétés savantes. Alumni et collaborateur externe de l’Université de Genève (Suisse).</div></details>
        </div>
      </div>

      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-time dark">11h45 - 12h15</div>
        <div class="talk-card minor">
          <div class="talk-speaker">Valeria Villa-Pérez &amp; Paula Alexandra Montenegro</div>
          <div class="talk-inst">Université Bordeaux Montaigne, CLLE</div>
          <div class="langtag minor">Occitan et basque, langues minorisées</div>
          <div class="talk-title">Questionner la place de la variation : analyse de témoignages d’enseignant·e·s des langues régionales de Nouvelle-Aquitaine</div>
          <details class="more"><summary>Voir le résumé</summary><div class="body">À partir d’entretiens menés auprès d’enseignant·e·s d’occitan et de basque en Nouvelle-Aquitaine, cette contribution interroge la place de la variation linguistique dans les pratiques de transmission de ces langues régionales. Elle met en évidence des trajectoires sociolinguistiques contrastées entre néolocuteurs et locuteurs traditionnels, une tendance partagée à privilégier une variété de référence en classe, et des arbitrages, vécus davantage comme des décisions pragmatiques que comme des choix de politique linguistique explicite, entre sécurisation des apprentissages et préservation de la diversité dialectale.</div></details>
